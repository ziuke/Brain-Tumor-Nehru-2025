{% load static %}
{% block content %}

<!-- footer -->
<footer class="w3l-footer-29-main bg-white" style="border-top: 1px solid #e2e8f0; padding: 40px 0 20px;">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-lg-6 col-md-12 mb-4 mb-lg-0 text-center text-lg-start">
        <a class="navbar-brand d-flex align-items-center justify-content-center justify-content-lg-start gap-2 mb-3"
          href="/">
          <span
            style="width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#00bcd4,#0097a7);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem;color:#fff;flex-shrink:0;">BH</span>
          <span style="font-size: 1.2rem; font-weight: 700; color: #1e293b; letter-spacing: -0.5px;">Brain<span
              style="color:#00bcd4">Tumour</span>Hub</span>
        </a>
        <p class="text-muted" style="max-width: 400px; margin: 0 auto 0 0; font-size: 0.95rem;">
          Advanced AI-powered brain tumour diagnosis platform connecting patients with top-tier neuro-specialists.
        </p>
      </div>

      <div class="col-lg-6 col-md-12 text-center text-lg-end">
        <div class="d-flex justify-content-center justify-content-lg-end gap-3 mb-3">
          <a href="#" class="text-muted" style="font-size: 1.2rem; transition: color 0.3s;"><i
              class="fab fa-facebook-f"></i></a>
          <a href="#" class="text-muted" style="font-size: 1.2rem; transition: color 0.3s;"><i
              class="fab fa-twitter"></i></a>
          <a href="#" class="text-muted" style="font-size: 1.2rem; transition: color 0.3s;"><i
              class="fab fa-linkedin-in"></i></a>
        </div>
      </div>
    </div>

    <div class="row mt-4 pt-4 border-top">
      <div class="col-12 text-center">
        <p class="text-muted mb-0" style="font-size: 0.9rem;">
          © 2025 Brain Tumour Hub. All rights reserved. <br class="d-md-none"> Built with <i
            class="fas fa-heart text-danger mx-1"></i> for healthcare.
        </p>
      </div>
    </div>
  </div>

  <!-- move top -->
  <button onclick="topFunction()" id="movetop" title="Go to top"
    style="background:#00bcd4; border-radius:50%; width: 45px; height: 45px; right: 20px; bottom: 20px; font-size: 20px; color: white; border: none; box-shadow: 0 4px 10px rgba(0, 188, 212, 0.4); z-index: 99;">
    <i class="fas fa-arrow-up"></i>
  </button>
  <script>
    // When the user scrolls down 20px from the top of the document, show the button
    window.onscroll = function () {
      scrollFunction()
    };

    function scrollFunction() {
      if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
        document.getElementById("movetop").style.display = "block";
      } else {
        document.getElementById("movetop").style.display = "none";
      }
    }

    // When the user clicks on the button, scroll to the top of the document
    function topFunction() {
      document.body.scrollTop = 0;
      document.documentElement.scrollTop = 0;
    }
  </script>
  <!-- /move top -->
</footer>
<!-- //footer -->

<!-- Template JavaScript -->
<script src="{% static 'js/jquery-3.3.1.min.js' %}"></script>
<script src="{% static 'js/theme-change.js' %}"></script>

<!-- owl carousel -->
<script src="{% static 'js/owl.carousel.js' %}"></script>
<!-- script for tesimonials carousel slider -->
<script>
  $(document).ready(function () {
    $("#owl-demo2").owlCarousel({
      loop: true,
      nav: false,
      margin: 50,
      responsiveClass: true,
      responsive: {
        0: { items: 1, nav: false },
        736: { items: 1, nav: false },
        991: { items: 2, margin: 30, nav: false },
        1080: { items: 3, nav: false }
      }
    })
  })
</script>
<!-- //script for tesimonials carousel slider -->

<!-- stats number counter-->
<script src="{% static 'js/jquery.waypoints.min.js' %}"></script>
<script src="{% static 'js/jquery.countup.js' %}"></script>
<script>
  $('.counter').countUp();
</script>
<!-- //stats number counter -->

<!-- disable body scroll which navbar is in active -->
<script>
  $(function () {
    $('.navbar-toggler').click(function () {
      $('body').toggleClass('noscroll');
    })
  });
</script>
<!-- disable body scroll which navbar is in active -->

<!--/MENU-JS-->
<script>
  $(window).on("scroll", function () {
    var scroll = $(window).scrollTop();
    if (scroll >= 80) {
      $("#site-header").addClass("nav-fixed");
      $("#site-header .navbar").css("padding", "0.5rem 1rem");
    } else {
      $("#site-header").removeClass("nav-fixed");
      $("#site-header .navbar").css("padding", "1rem");
    }
  });

  //Main navigation Active Class Add Remove
  $(".navbar-toggler").on("click", function () {
    $("header").toggleClass("active");
  });
  $(document).on("ready", function () {
    if ($(window).width() > 991) {
      $("header").removeClass("active");
    }
    $(window).on("resize", function () {
      if ($(window).width() > 991) {
        $("header").removeClass("active");
      }
    });
  });
</script>
<!--//MENU-JS-->

<script src="{% static 'js/bootstrap.min.js' %}"></script>

</body>

</html>
{% endblock %}
