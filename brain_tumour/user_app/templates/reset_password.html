{% load static %}
{% block content %}
{% include 'header.html' %}

<div class="banner-w3l-main">
    <div class="container mt-5 mb-5 pt-5 pb-5">
        <div class="row justify-content-center align-items-center">
            <div class="col-lg-5 col-md-8 col-sm-12">
                <div class="card p-5 shadow border-0" style="border-radius: 16px;">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <div class="bg-light rounded-circle d-inline-flex align-items-center justify-content-center mb-3 text-success shadow-sm"
                                style="width: 70px; height: 70px;">
                                <i class="fas fa-lock fa-2x"></i>
                            </div>
                            <h3 class="fw-bold text-dark">Reset Password</h3>
                            <p class="text-muted small">Enter the 6-character OTP sent to your email to set a new
                                password.</p>
                        </div>

                        <form class="reset-password-form mt-4" action="/reset_password" method="POST">
                            {% csrf_token %}

                            <!-- OTP Field -->
                            <div class="mb-4 position-relative">
                                <label class="form-label fw-bold small text-uppercase text-muted">6-Letter OTP</label>
                                <div class="input-group input-group-lg shadow-sm rounded">
                                    <span class="input-group-text bg-white border-end-0 text-muted"><i
                                            class="fas fa-hashtag"></i></span>
                                    <input type="text" placeholder="Enter OTP e.g., A1B2C3"
                                        class="form-control border-start-0 ps-0 text-uppercase fw-bold" name="otp"
                                        required maxlength="6" style="letter-spacing: 2px;">
                                </div>
                            </div>

                            <!-- New Password Field -->
                            <div class="mb-4 position-relative">
                                <label class="form-label fw-bold small text-uppercase text-muted">New Password</label>
                                <div class="input-group input-group-lg shadow-sm rounded">
                                    <span class="input-group-text bg-white border-end-0 text-muted"><i
                                            class="fas fa-key"></i></span>
                                    <input type="password" placeholder="Create new password"
                                        class="form-control border-start-0 ps-0" name="new_password" required
                                        minlength="8">
                                </div>
                            </div>

                            <!-- Confirm Password Field -->
                            <div class="mb-4 position-relative">
                                <label class="form-label fw-bold small text-uppercase text-muted">Confirm
                                    Password</label>
                                <div class="input-group input-group-lg shadow-sm rounded">
                                    <span class="input-group-text bg-white border-end-0 text-muted"><i
                                            class="fas fa-check-double"></i></span>
                                    <input type="password" placeholder="Re-enter new password"
                                        class="form-control border-start-0 ps-0" name="confirm_password" required
                                        minlength="8">
                                </div>
                            </div>

                            <button class="btn btn-lg w-100 shadow-sm mt-2" type="submit"
                                style="background: linear-gradient(135deg, #10b981, #059669); color: white; border-radius: 8px; font-weight: 600;">
                                <i class="fas fa-save me-2"></i> Update Password
                            </button>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% include 'footer.html' %}
{% endblock %}
