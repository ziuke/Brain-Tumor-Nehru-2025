{% load static %}
{% block content %}
{% include 'header.html' %}

<div class="banner-w3l-main">
    <div class="container mt-5 mb-5 pt-5 pb-5">
        <div class="row justify-content-center align-items-center">
            <div class="col-lg-5 col-md-8 col-sm-12">
                <div class="card p-5 shadow border-0" style="border-radius: 16px;">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <div class="bg-light rounded-circle d-inline-flex align-items-center justify-content-center mb-3 text-primary shadow-sm"
                                style="width: 70px; height: 70px;">
                                <i class="fas fa-key fa-2x"></i>
                            </div>
                            <h3 class="fw-bold text-dark">Forgot Password</h3>
                            <p class="text-muted small">Enter your registered email address and we'll send you an OTP to
                                reset your password.</p>
                        </div>

                        <form class="forgot-password-form mt-4" action="/forgotpswd/" method="POST">
                            {% csrf_token %}
                            <div class="mb-4 position-relative">
                                <label class="form-label fw-bold small text-uppercase text-muted">Email Address</label>
                                <div class="input-group input-group-lg shadow-sm rounded">
                                    <span class="input-group-text bg-white border-end-0 text-muted"><i
                                            class="fas fa-envelope"></i></span>
                                    <input type="email" placeholder="example@email.com"
                                        class="form-control border-start-0 ps-0" name="email" required
                                        style="font-size: 0.95rem;">
                                </div>
                            </div>

                            <button class="btn btn-lg w-100 shadow-sm" type="submit"
                                style="background: linear-gradient(135deg, #00bcd4, #0097a7); color: white; border-radius: 8px; font-weight: 600;">
                                <i class="fas fa-paper-plane me-2"></i> Send OTP
                            </button>
                        </form>

                        <div class="text-center mt-4 pt-3 border-top">
                            <p class="text-muted small mb-0">Remember your password? <a href="/login" class="fw-bold"
                                    style="color: #00bcd4; text-decoration: none;">Login here</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% include 'footer.html' %}
{% endblock %}
